<!DOCTYPE html>
<html lang="sw">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin Dashboard</title>
    <!-- Fonts & Styles (same as before) -->
    <style>
        /* All styles from previous version */
        /* ... (keep all styles) ... */
        
        /* ADD LOGIN SCREEN STYLES */
        #loginScreen {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: var(--bg-primary);
            display: flex;
            align-items: center;
            justify-content: center;
            z-index: 10000;
            padding: 20px;
        }
        
        #loginScreen.hidden {
            display: none;
        }
        
        .login-box {
            background: var(--bg-secondary);
            border: 1px solid var(--border-glass);
            border-radius: var(--radius-lg);
            padding: 48px 40px;
            max-width: 420px;
            width: 100%;
            box-shadow: var(--shadow);
        }
        
        .login-box .login-logo {
            text-align: center;
            margin-bottom: 32px;
        }
        
        .login-box .login-logo h1 {
            font-size: 28px;
            font-weight: 800;
        }
        
        .login-box .login-logo h1 span {
            color: var(--accent);
        }
        
        .login-box .login-logo p {
            color: var(--text-secondary);
            font-size: 14px;
            margin-top: 4px;
        }
        
        .login-box .form-group {
            margin-bottom: 18px;
        }
        
        .login-box .form-group label {
            display: block;
            font-size: 13px;
            font-weight: 600;
            color: var(--text-secondary);
            margin-bottom: 6px;
        }
        
        .login-box .form-group input {
            width: 100%;
            padding: 12px 16px;
            background: var(--bg-glass);
            border: 1px solid var(--border-glass);
            border-radius: var(--radius-sm);
            color: var(--text-primary);
            font-size: 14px;
            transition: var(--transition);
        }
        
        .login-box .form-group input:focus {
            outline: none;
            border-color: var(--accent);
            box-shadow: 0 0 20px var(--accent-glow);
        }
        
        .login-box .btn-login {
            width: 100%;
            padding: 14px;
            background: var(--accent);
            color: white;
            border: none;
            border-radius: var(--radius-sm);
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
            transition: var(--transition);
            margin-top: 8px;
        }
        
        .login-box .btn-login:hover {
            background: var(--accent-hover);
            transform: translateY(-2px);
            box-shadow: 0 8px 24px var(--accent-glow);
        }
        
        .login-box .login-error {
            color: #ff6b6b;
            font-size: 14px;
            text-align: center;
            margin-top: 12px;
            min-height: 24px;
        }
    </style>
</head>
<body>

    <!-- ============================================
    LOGIN SCREEN
    ============================================ -->
    <div id="loginScreen">
        <div class="login-box">
            <div class="login-logo">
                <h1>Learn<span>Hub</span></h1>
                <p>Admin Dashboard</p>
            </div>
            <form id="loginForm">
                <div class="form-group">
                    <label>Barua pepe</label>
                    <input type="email" id="loginEmail" placeholder="admin@example.com" required>
                </div>
                <div class="form-group">
                    <label>Nenosiri</label>
                    <input type="password" id="loginPassword" placeholder="••••••••" required>
                </div>
                <button type="submit" class="btn-login">Ingia</button>
                <div class="login-error" id="loginError"></div>
            </form>
        </div>
    </div>

    <!-- ============================================
    ADMIN DASHBOARD (Hidden until login)
    ============================================ -->
    <div id="adminDashboard" style="display:none;">
        <!-- All admin content here... -->
    </div>

    <!-- ============================================
    JAVASCRIPT - COMPLETE ADMIN WITH AUTH
    ============================================ -->
    <script>
        // ============================================
        // CONFIGURATION
        // ============================================
        const API_BASE = window.location.origin + '/api';
        let authToken = null;
        let currentUser = null;
        let isAuthenticated = false;

        // ============================================
        // TOAST SYSTEM
        // ============================================
        function showToast(message, type = 'info') {
            // Create toast container if doesn't exist
            let container = document.getElementById('toastContainer');
            if (!container) {
                container = document.createElement('div');
                container.id = 'toastContainer';
                container.className = 'toast-container';
                document.body.appendChild(container);
            }

            const icons = {
                success: 'fa-check-circle',
                error: 'fa-exclamation-circle',
                warning: 'fa-exclamation-triangle',
                info: 'fa-info-circle'
            };

            const toast = document.createElement('div');
            toast.className = `toast ${type}`;
            toast.innerHTML = `
                <span class="toast-icon"><i class="fas ${icons[type] || icons.info}"></i></span>
                <span class="toast-message">${message}</span>
                <button class="toast-close"><i class="fas fa-times"></i></button>
            `;

            toast.querySelector('.toast-close').addEventListener('click', () => {
                toast.remove();
            });

            container.appendChild(toast);

            setTimeout(() => {
                toast.style.opacity = '0';
                setTimeout(() => toast.remove(), 300);
            }, 4000);
        }

        // ============================================
        // API HELPER WITH AUTH
        // ============================================
        async function apiFetch(endpoint, options = {}) {
            try {
                const headers = {
                    'Content-Type': 'application/json',
                    ...(options.headers || {})
                };

                // Add auth token if available and not a public endpoint
                const isPublic = endpoint.includes('/auth/login') || 
                                endpoint.includes('/auth/register') ||
                                endpoint.includes('/messages') ||
                                (endpoint.includes('/courses') && !options.method) ||
                                endpoint.includes('/categories') ||
                                endpoint.includes('/homepage') ||
                                endpoint.includes('/notifications') ||
                                endpoint.includes('/settings');

                if (authToken && !isPublic) {
                    headers['Authorization'] = `Bearer ${authToken}`;
                }

                const response = await fetch(API_BASE + endpoint, {
                    ...options,
                    headers
                });

                // Handle 401 Unauthorized
                if (response.status === 401) {
                    const error = await response.json().catch(() => ({}));
                    if (error.error && error.error.includes('expired')) {
                        showToast('Session expired. Please login again.', 'error');
                        logout();
                        return null;
                    }
                    throw new Error(error.error || 'Authentication required');
                }

                if (!response.ok) {
                    const error = await response.json().catch(() => ({}));
                    throw new Error(error.error || 'Request failed');
                }

                return await response.json();
            } catch (error) {
                console.error('API Error:', error);
                throw error;
            }
        }

        // ============================================
        // AUTHENTICATION
        // ============================================
        async function login(email, password) {
            try {
                const data = await apiFetch('/auth/login', {
                    method: 'POST',
                    body: JSON.stringify({ email, password })
                });

                if (!data || !data.token) {
                    throw new Error('Login failed');
                }

                authToken = data.token;
                currentUser = data.user;
                isAuthenticated = true;

                // Save to localStorage
                localStorage.setItem('adminToken', authToken);
                localStorage.setItem('adminUser', JSON.stringify(currentUser));

                // Show dashboard
                document.getElementById('loginScreen').classList.add('hidden');
                document.getElementById('adminDashboard').style.display = 'flex';

                // Update user info
                document.getElementById('userName').textContent = currentUser.displayName || currentUser.email;
                document.getElementById('userRole').textContent = currentUser.role || 'Admin';
                document.getElementById('userAvatar').textContent = (currentUser.displayName || 'A')[0].toUpperCase();

                showToast(`Welcome, ${currentUser.displayName || 'Admin'}!`, 'success');
                
                // Load all data
                loadAllData();
                return true;
            } catch (error) {
                document.getElementById('loginError').textContent = error.message;
                return false;
            }
        }

        function logout() {
            authToken = null;
            currentUser = null;
            isAuthenticated = false;
            localStorage.removeItem('adminToken');
            localStorage.removeItem('adminUser');
            document.getElementById('loginScreen').classList.remove('hidden');
            document.getElementById('adminDashboard').style.display = 'none';
            showToast('Logged out successfully', 'info');
        }

        // Check saved session
        function checkSession() {
            const token = localStorage.getItem('adminToken');
            const user = localStorage.getItem('adminUser');

            if (token && user) {
                authToken = token;
                currentUser = JSON.parse(user);
                isAuthenticated = true;
                
                document.getElementById('loginScreen').classList.add('hidden');
                document.getElementById('adminDashboard').style.display = 'flex';
                
                document.getElementById('userName').textContent = currentUser.displayName || currentUser.email;
                document.getElementById('userRole').textContent = currentUser.role || 'Admin';
                document.getElementById('userAvatar').textContent = (currentUser.displayName || 'A')[0].toUpperCase();
                
                loadAllData();
                return true;
            }
            return false;
        }

        // ============================================
        // LOAD ALL DATA (Only when authenticated)
        // ============================================
        function loadAllData() {
            if (!isAuthenticated) return;
            loadDashboard();
            loadCourses();
            loadCategories();
            loadUsers();
            loadMessages();
            loadHomepageSettings();
            loadSettings();
        }

        // ============================================
        // LOAD DASHBOARD STATS
        // ============================================
        async function loadDashboard() {
            if (!isAuthenticated) return;
            try {
                const stats = await apiFetch('/stats');
                if (stats) {
                    document.getElementById('statCourses').textContent = stats.totalCourses || 0;
                    document.getElementById('statUsers').textContent = stats.totalUsers || 0;
                    document.getElementById('statMessages').textContent = stats.unreadMessages || 0;
                    document.getElementById('statPublished').textContent = stats.publishedCourses || 0;
                    document.getElementById('userCount').textContent = stats.totalUsers || 0;
                    document.getElementById('messageCount').textContent = stats.unreadMessages || 0;
                }
            } catch (error) {
                console.error('Error loading stats:', error);
                // Don't show toast for stats errors - they'll retry
            }
        }

        // ============================================
        // LOAD COURSES (Protected)
        // ============================================
        async function loadCourses() {
            if (!isAuthenticated) return;
            const container = document.getElementById('coursesTableContainer');
            if (!container) return;
            
            try {
                const courses = await apiFetch('/courses');
                if (!courses || courses.length === 0) {
                    container.innerHTML = `
                        <div class="empty-state">
                            <i class="fas fa-graduation-cap"></i>
                            <h4>No Courses</h4>
                            <p>Click "Add Course" to create your first course.</p>
                        </div>
                    `;
                    return;
                }

                let html = `
                    <table class="table">
                        <thead>
                            <tr>
                                <th>Title</th>
                                <th>Category</th>
                                <th>Level</th>
                                <th>Status</th>
                                <th>Actions</th>
                            </tr>
                        </thead>
                        <tbody>
                `;

                courses.forEach(course => {
                    html += `
                        <tr>
                            <td><strong>${course.title || 'Untitled'}</strong></td>
                            <td>${course.category || 'N/A'}</td>
                            <td>${course.level || 'Beginner'}</td>
                            <td>
                                <span class="status-badge ${course.status || 'draft'}">
                                    ${course.status || 'draft'}
                                </span>
                            </td>
                            <td>
                                <button class="btn btn-primary btn-xs" onclick="editCourse('${course.id}')">
                                    <i class="fas fa-edit"></i>
                                </button>
                                <button class="btn btn-danger btn-xs" onclick="deleteCourse('${course.id}')">
                                    <i class="fas fa-trash"></i>
                                </button>
                            </td>
                        </tr>
                    `;
                });

                html += `</tbody></table>`;
                container.innerHTML = html;
            } catch (error) {
                container.innerHTML = `
                    <div class="empty-state">
                        <i class="fas fa-exclamation-triangle"></i>
                        <h4>Error</h4>
                        <p>${error.message}</p>
                    </div>
                `;
            }
        }

        // ============================================
        // ADD COURSE (Protected)
        // ============================================
        document.addEventListener('DOMContentLoaded', () => {
            const addBtn = document.getElementById('addCourseBtn');
            if (addBtn) {
                addBtn.addEventListener('click', () => {
                    if (!isAuthenticated) {
                        showToast('Please login first', 'error');
                        return;
                    }
                    openModal('Add New Course', `
                        <form id="courseForm">
                            <div class="form-group">
                                <label>Course Title *</label>
                                <input type="text" id="courseTitle" placeholder="Enter course title" required>
                            </div>
                            <div class="form-group">
                                <label>Description</label>
                                <textarea id="courseDescription" rows="3" placeholder="Course description..."></textarea>
                            </div>
                            <div class="form-row">
                                <div class="form-group">
                                    <label>Category</label>
                                    <input type="text" id="courseCategory" placeholder="e.g. Web Development">
                                </div>
                                <div class="form-group">
                                    <label>Level</label>
                                    <select id="courseLevel">
                                        <option value="beginner">Beginner</option>
                                        <option value="intermediate">Intermediate</option>
                                        <option value="advanced">Advanced</option>
                                        <option value="expert">Expert</option>
                                    </select>
                                </div>
                            </div>
                            <div class="form-row">
                                <div class="form-group">
                                    <label>Instructor</label>
                                    <input type="text" id="courseInstructor" placeholder="Instructor name">
                                </div>
                                <div class="form-group">
                                    <label>Duration</label>
                                    <input type="text" id="courseDuration" placeholder="e.g. 4 weeks">
                                </div>
                            </div>
                            <div class="form-row">
                                <div class="form-group">
                                    <label>Lessons</label>
                                    <input type="number" id="courseLessons" placeholder="0">
                                </div>
                                <div class="form-group">
                                    <label>Price</label>
                                    <input type="number" id="coursePrice" placeholder="0 for free">
                                </div>
                            </div>
                            <div class="form-group">
                                <label>Cover Image URL</label>
                                <input type="text" id="courseCoverImage" placeholder="https://example.com/image.jpg">
                            </div>
                            <div class="form-group">
                                <label>Status</label>
                                <select id="courseStatus">
                                    <option value="draft">Draft</option>
                                    <option value="published">Published</option>
                                    <option value="archived">Archived</option>
                                </select>
                            </div>
                            <div class="form-group">
                                <label>
                                    <input type="checkbox" id="courseFeatured"> Featured Course
                                </label>
                            </div>
                            <div class="form-actions">
                                <button type="button" class="btn btn-outline" onclick="closeModal()">Cancel</button>
                                <button type="submit" class="btn btn-primary">Create Course</button>
                            </div>
                        </form>
                    `);

                    document.getElementById('courseForm').addEventListener('submit', async (e) => {
                        e.preventDefault();
                        if (!isAuthenticated) {
                            showToast('Please login first', 'error');
                            return;
                        }
                        
                        const data = {
                            title: document.getElementById('courseTitle').value.trim(),
                            description: document.getElementById('courseDescription').value.trim(),
                            category: document.getElementById('courseCategory').value.trim(),
                            level: document.getElementById('courseLevel').value,
                            instructor: document.getElementById('courseInstructor').value.trim(),
                            duration: document.getElementById('courseDuration').value.trim(),
                            lessons: parseInt(document.getElementById('courseLessons').value) || 0,
                            price: parseFloat(document.getElementById('coursePrice').value) || 0,
                            coverImage: document.getElementById('courseCoverImage').value.trim(),
                            status: document.getElementById('courseStatus').value,
                            isFeatured: document.getElementById('courseFeatured').checked
                        };

                        try {
                            await apiFetch('/courses', {
                                method: 'POST',
                                body: JSON.stringify(data)
                            });
                            showToast('Course created successfully!', 'success');
                            closeModal();
                            loadCourses();
                            loadDashboard();
                        } catch (error) {
                            showToast(error.message, 'error');
                        }
                    });
                });
            }
        });

        // ============================================
        // MODAL SYSTEM
        // ============================================
        function openModal(title, content) {
            const modalOverlay = document.getElementById('modalOverlay');
            if (!modalOverlay) return;
            
            document.getElementById('modalTitle').textContent = title;
            document.getElementById('modalBody').innerHTML = content;
            modalOverlay.classList.add('visible');
        }

        function closeModal() {
            const modalOverlay = document.getElementById('modalOverlay');
            if (modalOverlay) {
                modalOverlay.classList.remove('visible');
            }
        }

        // ============================================
        // SIDEBAR NAVIGATION
        // ============================================
        document.addEventListener('DOMContentLoaded', () => {
            document.querySelectorAll('.sidebar-nav .nav-item').forEach(item => {
                item.addEventListener('click', () => {
                    if (!isAuthenticated) {
                        showToast('Please login first', 'error');
                        return;
                    }
                    
                    document.querySelectorAll('.sidebar-nav .nav-item').forEach(i => i.classList.remove('active'));
                    item.classList.add('active');

                    const page = item.dataset.page;
                    document.querySelectorAll('.page').forEach(p => p.classList.remove('active'));
                    const targetPage = document.getElementById(`page-${page}`);
                    if (targetPage) {
                        targetPage.classList.add('active');
                    }

                    const titleMap = {
                        dashboard: 'Dashboard',
                        courses: 'Courses',
                        lessons: 'Lessons',
                        categories: 'Categories',
                        instructors: 'Instructors',
                        homepage: 'Homepage Settings',
                        media: 'Media Library',
                        users: 'Users',
                        messages: 'Messages',
                        notifications: 'Notifications',
                        settings: 'Settings',
                        'admin-access': 'Admin Access',
                        'activity-logs': 'Activity Logs'
                    };
                    document.getElementById('pageTitle').textContent = titleMap[page] || page;
                    document.getElementById('sidebar').classList.remove('open');
                    
                    loadPageData(page);
                });
            });

            // Menu toggle
            const menuBtn = document.getElementById('menuToggleSidebar');
            if (menuBtn) {
                menuBtn.addEventListener('click', () => {
                    document.getElementById('sidebar').classList.toggle('open');
                });
            }

            // Modal close
            const closeBtn = document.getElementById('modalCloseBtn');
            if (closeBtn) {
                closeBtn.addEventListener('click', closeModal);
            }
            const overlay = document.getElementById('modalOverlay');
            if (overlay) {
                overlay.addEventListener('click', (e) => {
                    if (e.target === e.currentTarget) closeModal();
                });
            }

            // Login form
            document.getElementById('loginForm').addEventListener('submit', async (e) => {
                e.preventDefault();
                const email = document.getElementById('loginEmail').value.trim();
                const password = document.getElementById('loginPassword').value.trim();
                await login(email, password);
            });

            // Logout
            const logoutBtn = document.getElementById('logoutBtn');
            if (logoutBtn) {
                logoutBtn.addEventListener('click', logout);
            }

            // Notification bell
            const notifBtn = document.getElementById('notificationBtn');
            if (notifBtn) {
                notifBtn.addEventListener('click', () => {
                    if (!isAuthenticated) {
                        showToast('Please login first', 'error');
                        return;
                    }
                    document.querySelector('[data-page="notifications"]')?.click();
                });
            }

            // Search
            const searchInput = document.getElementById('adminSearch');
            if (searchInput) {
                searchInput.addEventListener('keyup', (e) => {
                    if (e.key === 'Enter' && isAuthenticated) {
                        const query = e.target.value.trim();
                        if (query) {
                            showToast(`Searching for: "${query}"`, 'info');
                            document.querySelector('[data-page="courses"]')?.click();
                        }
                    }
                });
            }
        });

        // ============================================
        // PAGE DATA LOADER
        // ============================================
        function loadPageData(page) {
            if (!isAuthenticated) return;
            switch (page) {
                case 'dashboard': loadDashboard(); break;
                case 'courses': loadCourses(); break;
                case 'categories': loadCategories(); break;
                case 'users': loadUsers(); break;
                case 'messages': loadMessages(); break;
                case 'homepage': loadHomepageSettings(); break;
                case 'settings': loadSettings(); break;
            }
        }

        // ============================================
        // LOAD CATEGORIES (Protected)
        // ============================================
        async function loadCategories() {
            if (!isAuthenticated) return;
            const container = document.getElementById('categoriesTableContainer');
            if (!container) return;
            
            try {
                const categories = await apiFetch('/categories');
                if (!categories || categories.length === 0) {
                    container.innerHTML = `
                        <div class="empty-state">
                            <i class="fas fa-tags"></i>
                            <h4>No Categories</h4>
                            <p>Click "Add Category" to create one.</p>
                        </div>
                    `;
                    return;
                }

                let html = `
                    <table class="table">
                        <thead>
                            <tr>
                                <th>Name</th>
                                <th>Description</th>
                                <th>Courses</th>
                                <th>Actions</th>
                            </tr>
                        </thead>
                        <tbody>
                `;

                categories.forEach(cat => {
                    html += `
                        <tr>
                            <td><strong>${cat.name}</strong></td>
                            <td>${cat.description || '-'}</td>
                            <td>${cat.courseCount || 0}</td>
                            <td>
                                <button class="btn btn-primary btn-xs" onclick="editCategory('${cat.id}')">
                                    <i class="fas fa-edit"></i>
                                </button>
                                <button class="btn btn-danger btn-xs" onclick="deleteCategory('${cat.id}')">
                                    <i class="fas fa-trash"></i>
                                </button>
                            </td>
                        </tr>
                    `;
                });

                html += `</tbody></table>`;
                container.innerHTML = html;
            } catch (error) {
                container.innerHTML = `
                    <div class="empty-state">
                        <i class="fas fa-exclamation-triangle"></i>
                        <h4>Error</h4>
                        <p>${error.message}</p>
                    </div>
                `;
            }
        }

        // ============================================
        // ADD CATEGORY (Protected)
        // ============================================
        document.addEventListener('DOMContentLoaded', () => {
            const addCatBtn = document.getElementById('addCategoryBtn');
            if (addCatBtn) {
                addCatBtn.addEventListener('click', () => {
                    if (!isAuthenticated) {
                        showToast('Please login first', 'error');
                        return;
                    }
                    openModal('Add Category', `
                        <form id="categoryForm">
                            <div class="form-group">
                                <label>Category Name *</label>
                                <input type="text" id="categoryName" placeholder="e.g. Web Development" required>
                            </div>
                            <div class="form-group">
                                <label>Description</label>
                                <textarea id="categoryDescription" rows="2" placeholder="Category description..."></textarea>
                            </div>
                            <div class="form-row">
                                <div class="form-group">
                                    <label>Icon (FontAwesome class)</label>
                                    <input type="text" id="categoryIcon" placeholder="fa-code" value="fa-folder">
                                </div>
                                <div class="form-group">
                                    <label>Color (hex)</label>
                                    <input type="text" id="categoryColor" placeholder="#6c5ce7" value="#6c5ce7">
                                </div>
                            </div>
                            <div class="form-actions">
                                <button type="button" class="btn btn-outline" onclick="closeModal()">Cancel</button>
                                <button type="submit" class="btn btn-primary">Create Category</button>
                            </div>
                        </form>
                    `);

                    document.getElementById('categoryForm').addEventListener('submit', async (e) => {
                        e.preventDefault();
                        if (!isAuthenticated) {
                            showToast('Please login first', 'error');
                            return;
                        }
                        
                        const data = {
                            name: document.getElementById('categoryName').value.trim(),
                            description: document.getElementById('categoryDescription').value.trim(),
                            icon: document.getElementById('categoryIcon').value.trim(),
                            color: document.getElementById('categoryColor').value.trim(),
                            sortOrder: 0
                        };

                        try {
                            await apiFetch('/categories', {
                                method: 'POST',
                                body: JSON.stringify(data)
                            });
                            showToast('Category created successfully!', 'success');
                            closeModal();
                            loadCategories();
                        } catch (error) {
                            showToast(error.message, 'error');
                        }
                    });
                });
            }
        });

        // ============================================
        // EDIT CATEGORY (Protected)
        // ============================================
        window.editCategory = async (categoryId) => {
            if (!isAuthenticated) {
                showToast('Please login first', 'error');
                return;

        // ============================================
        // LOAD MESSAGES (Protected)
        // ============================================
        async function loadMessages() {
            if (!isAuthenticated) return;
            const container = document.getElementById('messagesTableContainer');
            if (!container) return;
            
            try {
                const messages = await apiFetch('/messages');
                if (!messages || messages.length === 0) {
                    container.innerHTML = `
                        <div class="empty-state">
                            <i class="fas fa-envelope"></i>
                            <h4>No Messages</h4>
                            <p>No messages from users yet.</p>
                        </div>
                    `;
                    return;
                }

                const unread = messages.filter(m => !m.isRead).length;
                const msgCount = document.getElementById('messageCount');
                if (msgCount) msgCount.textContent = unread;

                let html = `
                    <table class="table">
                        <thead>
                            <tr>
                                <th>From</th>
                                <th>Subject</th>
                                <th>Status</th>
                                <th>Date</th>
                                <th>Actions</th>
                            </tr>
                        </thead>
                        <tbody>
                `;

                messages.forEach(msg => {
                    html += `
                        <tr>
                            <td><strong>${msg.name}</strong><br><small>${msg.email}</small></td>
                            <td>${msg.subject || 'General'}</td>
                            <td>
                                <span class="status-badge ${msg.isRead ? 'read' : 'unread'}">
                                    ${msg.isRead ? 'Read' : 'Unread'}
                                </span>
                            </td>
                            <td>${new Date(msg.createdAt).toLocaleDateString()}</td>
                            <td>
                                <button class="btn btn-primary btn-xs" onclick="viewMessage('${msg.id}')">
                                    <i class="fas fa-eye"></i>
                                </button>
                                ${!msg.isRead ? `<button class="btn btn-success btn-xs" onclick="markMessageRead('${msg.id}')">
                                    <i class="fas fa-check"></i>
                                </button>` : ''}
                            </td>
                        </tr>
                    `;
                });

                html += `</tbody></table>`;
                container.innerHTML = html;
            } catch (error) {
                container.innerHTML = `
                    <div class="empty-state">
                        <i class="fas fa-exclamation-triangle"></i>
                        <h4>Error</h4>
                        <p>${error.message}</p>
                    </div>
                `;
            }
        }

                            <div class="form-group">
                                <label>Instructor</label>
                                <input type="text" id="editCourseInstructor" value="${course.instructor || ''}">
                            </div>
                            <div class="form-group">
                                <label>Duration</label>
                                <input type="text" id="editCourseDuration" value="${course.duration || ''}">
                            </div>
                        </div>
                        <div class="form-row">
                            <div class="form-group">
                                <label>Lessons</label>
                                <input type="number" id="editCourseLessons" value="${course.lessons || 0}">
                            </div>
                            <div class="form-group">
                                <label>Price</label>
                                <input type="number" id="editCoursePrice" value="${course.price || 0}">
                            </div>
                        </div>
                        <div class="form-group">
                            <label>Cover Image URL</label>
                            <input type="text" id="editCourseCoverImage" value="${course.coverImage || ''}">
                        </div>
                        <div class="form-group">
                            <label>Status</label>
                            <select id="editCourseStatus">
                                <option value="draft" ${course.status === 'draft' ? 'selected' : ''}>Draft</option>
                                <option value="published" ${course.status === 'published' ? 'selected' : ''}>Published</option>
                                <option value="archived" ${course.status === 'archived' ? 'selected' : ''}>Archived</option>
                            </select>
                        </div>
                        <div class="form-group">
                            <label>
                                <input type="checkbox" id="editCourseFeatured" ${course.isFeatured ? 'checked' : ''}> Featured Course
                            </label>
                        </div>
                        <div class="form-actions">
                            <button type="button" class="btn btn-outline" onclick="closeModal()">Cancel</button>
                            <button type="submit" class="btn btn-primary">Update Course</button>
                        </div>
                    </form>
                `);

                document.getElementById('editCourseForm').addEventListener('submit', async (e) => {
                    e.preventDefault();
                    if (!isAuthenticated) {
                        showToast('Please login first', 'error');
                        return;
                    }
                    
                    const data = {
                        title: document.getElementById('editCourseTitle').value.trim(),
                        description: document.getElementById('editCourseDescription').value.trim(),
                        category: document.getElementById('editCourseCategory').value.trim(),
                        level: document.getElementById('editCourseLevel').value,
                        instructor: document.getElementById('editCourseInstructor').value.trim(),
                        duration: document.getElementById('editCourseDuration').value.trim(),
                        lessons: parseInt(document.getElementById('editCourseLessons').value) || 0,
                        price: parseFloat(document.getElementById('editCoursePrice').value) || 0,
                        coverImage: document.getElementById('editCourseCoverImage').value.trim(),
                        status: document.getElementById('editCourseStatus').value,
                        isFeatured: document.getElementById('editCourseFeatured').checked
                    };

                    try {
                        await apiFetch(`/courses/${courseId}`, {
                            method: 'PUT',
                            body: JSON.stringify(data)
                        });
                        showToast('Course updated successfully!', 'success');
                        closeModal();
                        loadCourses();
                    } catch (error) {
                        showToast(error.message, 'error');
                    }
                });
            } catch (error) {
                showToast('Error loading course: ' + error.message, 'error');
            }
        };

        // ============================================
        // DELETE COURSE (Protected)
        // ============================================
        window.deleteCourse = async (courseId) => {
            if (!isAuthenticated) {
                showToast('Please login first', 'error');
                return;
            }
            
            if (!confirm('Are you sure you want to delete this course? This action cannot be undone.')) return;

            try {
                await apiFetch(`/courses/${courseId}`, {
                    method: 'DELETE'
                });
                showToast('Course deleted successfully!', 'success');
                loadCourses();
                loadDashboard();
            } catch (error) {
                showToast(error.message, 'error');
            }
        };

        // ============================================
        // INITIALIZE
        // ============================================
        document.addEventListener('DOMContentLoaded', () => {
            // Check for existing session
            if (!checkSession()) {
                // Show login screen
                document.getElementById('loginScreen').classList.remove('hidden');
                document.getElementById('adminDashboard').style.display = 'none';
            }

            // Auto-refresh data every 60 seconds
            setInterval(() => {
                if (isAuthenticated) {
                    loadDashboard();
                }
            }, 60000);

            console.log('🚀 Admin Dashboard loaded successfully!');
            console.log('📚 Educational Platform Admin Panel');
            console.log('🔒 Authentication: ' + (isAuthenticated ? '✅ Logged in' : '❌ Not logged in'));
        });
    </script>
</body>
  </html>
