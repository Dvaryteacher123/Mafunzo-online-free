<!DOCTYPE html>
<html lang="sw" data-theme="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Solo Chat - Chat</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800;900&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <style>
        /* ============================================
           ROOT VARIABLES
           ============================================ */
        :root {
            --bg-primary: #0a0a0f;
            --bg-secondary: #111118;
            --bg-card: rgba(255, 255, 255, 0.04);
            --bg-glass: rgba(255, 255, 255, 0.06);
            --bg-hover: rgba(255, 255, 255, 0.08);
            --text-primary: #ffffff;
            --text-secondary: rgba(255, 255, 255, 0.75);
            --text-muted: rgba(255, 255, 255, 0.4);
            --accent: #6c5ce7;
            --accent-hover: #7c6cf0;
            --accent-glow: rgba(108, 92, 231, 0.3);
            --accent-2: #00d4ff;
            --border-glass: rgba(255, 255, 255, 0.06);
            --shadow: 0 8px 32px rgba(0, 0, 0, 0.4);
            --radius: 16px;
            --radius-sm: 10px;
            --radius-lg: 24px;
            --transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
            --success: #51cf66;
            --danger: #ff6b6b;
            --warning: #ffd93d;
            --chat-bg: #0d0d14;
            --msg-received: rgba(255, 255, 255, 0.06);
            --msg-sent: linear-gradient(135deg, var(--accent), #a29bfe);
        }

        [data-theme="light"] {
            --bg-primary: #f0f2f5;
            --bg-secondary: #e8eaed;
            --bg-card: rgba(0, 0, 0, 0.03);
            --bg-glass: rgba(0, 0, 0, 0.05);
            --bg-hover: rgba(0, 0, 0, 0.05);
            --text-primary: #1a1a2e;
            --text-secondary: rgba(0, 0, 0, 0.7);
            --text-muted: rgba(0, 0, 0, 0.4);
            --border-glass: rgba(0, 0, 0, 0.08);
            --shadow: 0 8px 32px rgba(0, 0, 0, 0.08);
            --chat-bg: #ffffff;
            --msg-received: #f0f0f0;
            --msg-sent: linear-gradient(135deg, var(--accent), #a29bfe);
        }

        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: 'Inter', -apple-system, sans-serif;
            background: var(--bg-primary);
            color: var(--text-primary);
            line-height: 1.6;
            min-height: 100vh;
            overflow: hidden;
            transition: background 0.3s ease, color 0.3s ease;
        }

        ::-webkit-scrollbar { width: 5px; }
        ::-webkit-scrollbar-track { background: var(--bg-primary); }
        ::-webkit-scrollbar-thumb { background: var(--accent); border-radius: 10px; }

        /* ============================================
           LOADING
           ============================================ */
        #loading-screen {
            position: fixed;
            top: 0; left: 0;
            width: 100%; height: 100%;
            background: var(--bg-primary);
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            z-index: 9999;
            transition: opacity 0.5s ease;
        }
        #loading-screen.hidden { opacity: 0; pointer-events: none; }
        .loader {
            width: 48px; height: 48px;
            border-radius: 50%;
            border: 3px solid transparent;
            border-top-color: var(--accent);
            border-bottom-color: var(--accent-2);
            animation: spin 0.8s linear infinite;
        }
        @keyframes spin { to { transform: rotate(360deg); } }
        .loader-text { margin-top: 16px; color: var(--text-secondary); font-size: 13px; letter-spacing: 3px; text-transform: uppercase; opacity: 0.6; }

        /* ============================================
           CHAT LAYOUT
           ============================================ */
        .chat-container {
            display: flex;
            height: 100vh;
            background: var(--bg-primary);
        }

        /* ============================================
           SIDEBAR - CONTACTS LIST
           ============================================ */
        .chat-sidebar {
            width: 340px;
            background: var(--bg-secondary);
            border-right: 1px solid var(--border-glass);
            display: flex;
            flex-direction: column;
            flex-shrink: 0;
        }

        .chat-sidebar .header {
            padding: 16px 20px;
            border-bottom: 1px solid var(--border-glass);
            display: flex;
            align-items: center;
            justify-content: space-between;
        }
        .chat-sidebar .header h2 {
            font-size: 18px;
            font-weight: 700;
        }
        .chat-sidebar .header h2 span {
            background: linear-gradient(135deg, var(--accent), var(--accent-2));
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
        }
        .chat-sidebar .header .actions {
            display: flex;
            gap: 8px;
        }
        .chat-sidebar .header .actions button {
            background: var(--bg-glass);
            border: 1px solid var(--border-glass);
            border-radius: var(--radius-sm);
            color: var(--text-secondary);
            padding: 6px 10px;
            cursor: pointer;
            transition: var(--transition);
            font-size: 14px;
        }
        .chat-sidebar .header .actions button:hover {
            background: var(--bg-hover);
            color: var(--text-primary);
        }

        .chat-sidebar .search-box {
            padding: 12px 20px;
            border-bottom: 1px solid var(--border-glass);
        }
        .chat-sidebar .search-box input {
            width: 100%;
            padding: 10px 14px;
            background: var(--bg-glass);
            border: 1px solid var(--border-glass);
            border-radius: var(--radius-sm);
            color: var(--text-primary);
            font-size: 13px;
            transition: var(--transition);
            font-family: inherit;
        }
        .chat-sidebar .search-box input:focus {
            outline: none;
            border-color: var(--accent);
            box-shadow: 0 0 20px var(--accent-glow);
        }
        .chat-sidebar .search-box input::placeholder { color: var(--text-muted); }

        .chat-sidebar .contacts {
            flex: 1;
            overflow-y: auto;
            padding: 8px 0;
        }

        .contact-item {
            display: flex;
            align-items: center;
            gap: 12px;
            padding: 10px 20px;
            cursor: pointer;
            transition: var(--transition);
            border-radius: var(--radius-sm);
            margin: 2px 8px;
        }
        .contact-item:hover {
            background: var(--bg-glass);
        }
        .contact-item.active {
            background: var(--accent-glow);
            border: 1px solid rgba(108, 92, 231, 0.2);
        }
        .contact-item .avatar {
            width: 44px;
            height: 44px;
            border-radius: 50%;
            background: linear-gradient(135deg, var(--accent), var(--accent-2));
            display: flex;
            align-items: center;
            justify-content: center;
            font-weight: 700;
            font-size: 16px;
            color: white;
            flex-shrink: 0;
            position: relative;
        }
        .contact-item .avatar .status-dot {
            position: absolute;
            bottom: 2px;
            right: 2px;
            width: 10px;
            height: 10px;
            border-radius: 50%;
            border: 2px solid var(--bg-secondary);
        }
        .contact-item .avatar .status-dot.online { background: var(--success); }
        .contact-item .avatar .status-dot.offline { background: var(--text-muted); }
        .contact-item .avatar .status-dot.away { background: var(--warning); }

        .contact-item .info { flex: 1; min-width: 0; }
        .contact-item .info .name {
            font-size: 14px;
            font-weight: 600;
            display: flex;
            align-items: center;
            gap: 6px;
        }
        .contact-item .info .name .badge-online {
            font-size: 10px;
            color: var(--success);
        }
        .contact-item .info .last-msg {
            font-size: 12px;
            color: var(--text-muted);
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }
        .contact-item .time {
            font-size: 11px;
            color: var(--text-muted);
            flex-shrink: 0;
        }
        .contact-item .unread {
            background: var(--danger);
            color: white;
            font-size: 10px;
            font-weight: 700;
            padding: 2px 8px;
            border-radius: 50px;
            flex-shrink: 0;
        }

        .empty-contacts {
            text-align: center;
            padding: 40px 20px;
            color: var(--text-secondary);
        }
        .empty-contacts i {
            font-size: 48px;
            color: var(--text-muted);
            opacity: 0.3;
            margin-bottom: 12px;
            display: block;
        }
        .empty-contacts h4 { font-size: 16px; font-weight: 600; margin-bottom: 4px; }
        .empty-contacts p { font-size: 13px; }

        /* ============================================
           CHAT AREA
           ============================================ */
        .chat-area {
            flex: 1;
            display: flex;
            flex-direction: column;
            background: var(--chat-bg);
        }

        /* Chat Header */
        .chat-area .chat-header {
            padding: 14px 24px;
            border-bottom: 1px solid var(--border-glass);
            display: flex;
            align-items: center;
            justify-content: space-between;
            background: var(--bg-secondary);
            flex-shrink: 0;
        }
        .chat-area .chat-header .left {
            display: flex;
            align-items: center;
            gap: 12px;
        }
        .chat-area .chat-header .left .avatar {
            width: 40px;
            height: 40px;
            border-radius: 50%;
            background: linear-gradient(135deg, var(--accent), var(--accent-2));
            display: flex;
            align-items: center;
            justify-content: center;
            font-weight: 700;
            font-size: 14px;
            color: white;
            flex-shrink: 0;
        }
        .chat-area .chat-header .left .info .name {
            font-size: 15px;
            font-weight: 600;
        }
        .chat-area .chat-header .left .info .status {
            font-size: 12px;
            color: var(--text-muted);
        }
        .chat-area .chat-header .left .info .status.online { color: var(--success); }
        .chat-area .chat-header .left .info .status.typing {
            color: var(--accent-2);
            animation: typingDots 1.2s infinite;
        }
        @keyframes typingDots {
            0%, 20% { opacity: 0.3; }
            50% { opacity: 1; }
            80%, 100% { opacity: 0.3; }
        }

        .chat-area .chat-header .right {
            display: flex;
            gap: 6px;
        }
        .chat-area .chat-header .right button {
            background: var(--bg-glass);
            border: 1px solid var(--border-glass);
            border-radius: var(--radius-sm);
            color: var(--text-secondary);
            padding: 8px 12px;
            cursor: pointer;
            transition: var(--transition);
            font-size: 14px;
        }
        .chat-area .chat-header .right button:hover {
            background: var(--bg-hover);
            color: var(--text-primary);
            border-color: var(--accent);
        }
        .chat-area .chat-header .right button.danger:hover {
            border-color: var(--danger);
            color: var(--danger);
        }

        /* Messages */
        .chat-area .messages {
            flex: 1;
            overflow-y: auto;
            padding: 20px 24px;
            display: flex;
            flex-direction: column;
            gap: 4px;
        }

        .message {
            max-width: 75%;
            padding: 10px 14px;
            border-radius: var(--radius);
            position: relative;
            animation: msgIn 0.2s ease;
        }
        @keyframes msgIn {
            from { opacity: 0; transform: translateY(10px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .message.received {
            align-self: flex-start;
            background: var(--msg-received);
            border: 1px solid var(--border-glass);
            border-bottom-left-radius: 4px;
        }
        .message.sent {
            align-self: flex-end;
            background: var(--msg-sent);
            color: white;
            border-bottom-right-radius: 4px;
        }

        .message .text { font-size: 14px; line-height: 1.5; word-wrap: break-word; }
        .message .time {
            font-size: 10px;
            color: var(--text-muted);
            margin-top: 4px;
            display: block;
            opacity: 0.7;
        }
        .message.sent .time { color: rgba(255, 255, 255, 0.6); }

        .message .status-icon {
            font-size: 12px;
            margin-left: 4px;
        }
        .message .status-icon.delivered { color: var(--text-muted); }
        .message .status-icon.seen { color: var(--accent-2); }

        .message .reply-to {
            font-size: 12px;
            color: var(--text-muted);
            padding: 4px 8px;
            background: var(--bg-glass);
            border-radius: var(--radius-sm);
            margin-bottom: 4px;
            border-left: 3px solid var(--accent);
        }
        .message.sent .reply-to { color: rgba(255, 255, 255, 0.7); background: rgba(255, 255, 255, 0.1); }

        .message .reactions {
            display: flex;
            gap: 4px;
            margin-top: 4px;
            flex-wrap: wrap;
        }
        .message .reactions .reaction {
            font-size: 14px;
            background: var(--bg-glass);
            padding: 2px 6px;
            border-radius: 50px;
            cursor: pointer;
            transition: var(--transition);
        }
        .message .reactions .reaction:hover { transform: scale(1.1); }

        .message .menu-dots {
            position: absolute;
            top: 4px;
            right: 4px;
            background: transparent;
            border: none;
            color: var(--text-muted);
            cursor: pointer;
            padding: 2px 6px;
            border-radius: var(--radius-sm);
            opacity: 0;
            transition: var(--transition);
        }
        .message:hover .menu-dots { opacity: 1; }
        .message .menu-dots:hover { background: var(--bg-glass); }

        .date-divider {
            text-align: center;
            font-size: 12px;
            color: var(--text-muted);
            padding: 8px 0;
            margin: 4px 0;
        }

        /* Typing Indicator */
        .typing-indicator {
            display: none;
            align-self: flex-start;
            padding: 8px 14px;
            background: var(--msg-received);
            border: 1px solid var(--border-glass);
            border-radius: var(--radius);
            border-bottom-left-radius: 4px;
            gap: 4px;
        }
        .typing-indicator.visible { display: flex; }
        .typing-indicator span {
            width: 6px;
            height: 6px;
            background: var(--text-muted);
            border-radius: 50%;
            animation: typeBounce 1.2s infinite;
        }
        .typing-indicator span:nth-child(2) { animation-delay: 0.2s; }
        .typing-indicator span:nth-child(3) { animation-delay: 0.4s; }
        @keyframes typeBounce {
            0%, 60%, 100% { transform: translateY(0); }
            30% { transform: translateY(-6px); }
        }

        /* Chat Input */
        .chat-area .chat-input {
            padding: 12px 20px;
            border-top: 1px solid var(--border-glass);
            display: flex;
            align-items: center;
            gap: 10px;
            background: var(--bg-secondary);
            flex-shrink: 0;
        }
        .chat-area .chat-input .emoji-btn {
            background: transparent;
            border: none;
            color: var(--text-muted);
            font-size: 20px;
            cursor: pointer;
            transition: var(--transition);
        }
        .chat-area .chat-input .emoji-btn:hover { color: var(--text-primary); transform: scale(1.1); }

        .chat-area .chat-input .input-wrapper {
            flex: 1;
            display: flex;
            align-items: center;
            background: var(--bg-glass);
            border: 1px solid var(--border-glass);
            border-radius: var(--radius-lg);
            padding: 4px 4px 4px 16px;
            transition: var(--transition);
        }
        .chat-area .chat-input .input-wrapper:focus-within {
            border-color: var(--accent);
            box-shadow: 0 0 20px var(--accent-glow);
        }
        .chat-area .chat-input .input-wrapper input {
            flex: 1;
            background: transparent;
            border: none;
            color: var(--text-primary);
            font-size: 14px;
            padding: 8px 0;
            outline: none;
            font-family: inherit;
        }
        .chat-area .chat-input .input-wrapper input::placeholder { color: var(--text-muted); }
        .chat-area .chat-input .input-wrapper .attach-btn {
            background: transparent;
            border: none;
            color: var(--text-muted);
            padding: 6px 10px;
            cursor: pointer;
            font-size: 16px;
            transition: var(--transition);
        }
        .chat-area .chat-input .input-wrapper .attach-btn:hover { color: var(--text-primary); }

        .chat-area .chat-input .send-btn {
            padding: 10px 18px;
            border-radius: 50%;
            background: linear-gradient(135deg, var(--accent), #a29bfe);
            color: white;
            border: none;
            cursor: pointer;
            font-size: 16px;
            transition: var(--transition);
            box-shadow: 0 0 20px var(--accent-glow);
            width: 44px;
            height: 44px;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        .chat-area .chat-input .send-btn:hover {
            transform: scale(1.05);
            box-shadow: 0 0 40px var(--accent-glow);
        }
        .chat-area .chat-input .send-btn:disabled {
            opacity: 0.5;
            cursor: not-allowed;
            transform: none;
        }

        /* ============================================
           EMOJI PICKER
           ============================================ */
        .emoji-picker {
            display: none;
            position: absolute;
            bottom: 80px;
            right: 20px;
            background: var(--bg-secondary);
            border: 1px solid var(--border-glass);
            border-radius: var(--radius);
            padding: 12px;
            width: 280px;
            max-height: 200px;
            overflow-y: auto;
            box-shadow: var(--shadow);
            z-index: 10;
        }
        .emoji-picker.visible { display: block; }
        .emoji-picker .emoji-grid {
            display: grid;
            grid-template-columns: repeat(6, 1fr);
            gap: 4px;
        }
        .emoji-picker .emoji-grid button {
            background: transparent;
            border: none;
            font-size: 24px;
            cursor: pointer;
            padding: 4px;
            border-radius: var(--radius-sm);
            transition: var(--transition);
        }
        .emoji-picker .emoji-grid button:hover {
            background: var(--bg-glass);
            transform: scale(1.1);
        }

        /* ============================================
           RESPONSIVE
           ============================================ */
        @media (max-width: 768px) {
            .chat-sidebar {
                width: 100%;
                position: absolute;
                top: 0;
                left: 0;
                height: 100%;
                z-index: 10;
                transform: translateX(0);
                transition: transform 0.3s ease;
            }
            .chat-sidebar.hidden {
                transform: translateX(-100%);
            }
            .chat-area .chat-header .back-btn {
                display: block !important;
            }
            .message { max-width: 85%; }
            .emoji-picker { right: 10px; width: 240px; }
        }

        @media (min-width: 769px) {
            .chat-area .chat-header .back-btn { display: none !important; }
        }

        @media (max-width: 480px) {
            .chat-area .messages { padding: 12px; }
            .chat-area .chat-input { padding: 8px 12px; }
            .message { max-width: 90%; }
            .chat-area .chat-header { padding: 10px 16px; }
            .chat-sidebar .header { padding: 12px 16px; }
            .emoji-picker { right: 5px; width: 200px; }
        }
    </style>
</head>
<body>

    <!-- ============================================
    LOADING
    ============================================ -->
    <div id="loading-screen">
        <div class="loader"></div>
        <div class="loader-text">Loading Chat...</div>
    </div>

    <!-- ============================================
    CHAT CONTAINER
    ============================================ -->
    <div class="chat-container">

        <!-- Sidebar - Contacts -->
        <aside class="chat-sidebar" id="chatSidebar">
            <div class="header">
                <h2>Solo <span>Chat</span></h2>
                <div class="actions">
                    <button onclick="goHome()" title="Dashboard"><i class="fas fa-home"></i></button>
                    <button onclick="toggleTheme()" title="Theme"><i class="fas fa-moon" id="themeIcon"></i></button>
                </div>
            </div>

            <div class="search-box">
                <input type="text" placeholder="Search contacts..." id="searchContacts">
            </div>

            <div class="contacts" id="contactsList">
                <!-- Contacts rendered by JavaScript -->
                <div class="empty-contacts">
                    <i class="fas fa-comment-slash"></i>
                    <h4>No Contacts</h4>
                    <p>Start a chat by finding someone new!</p>
                </div>
            </div>
        </aside>

        <!-- Chat Area -->
        <main class="chat-area">

            <!-- Chat Header -->
            <header class="chat-header">
                <div class="left">
                    <button class="back-btn" onclick="toggleSidebar()" style="background:transparent;border:none;color:var(--text-primary);font-size:20px;cursor:pointer;">
                        <i class="fas fa-arrow-left"></i>
                    </button>
                    <div class="avatar" id="chatAvatar">S</div>
                    <div class="info">
                        <div class="name" id="chatName">Select a chat</div>
                        <div class="status" id="chatStatus">No conversation</div>
                    </div>
                </div>
                <div class="right">
                    <button onclick="startCall()" title="Voice Call"><i class="fas fa-phone"></i></button>
                    <button onclick="startVideo()" title="Video Call"><i class="fas fa-video"></i></button>
                    <button onclick="showMoreOptions()" title="More"><i class="fas fa-ellipsis-v"></i></button>
                </div>
            </header>

            <!-- Messages -->
            <div class="messages" id="messagesContainer">
                <div class="empty-contacts" style="align-self:center;padding:40px 20px;">
                    <i class="fas fa-comment-dots" style="font-size:48px;color:var(--text-muted);opacity:0.3;"></i>
                    <h4>No messages yet</h4>
                    <p>Select a contact to start chatting</p>
                </div>
            </div>

            <!-- Typing Indicator -->
            <div class="typing-indicator" id="typingIndicator">
                <span></span><span></span><span></span>
            </div>

            <!-- Chat Input -->
            <div class="chat-input">
                <button class="emoji-btn" onclick="toggleEmojiPicker()"><i class="fas fa-smile"></i></button>
                <div class="input-wrapper">
                    <input type="text" id="messageInput" placeholder="Type a message..." onkeydown="handleKeyDown(event)">
                    <button class="attach-btn" onclick="attachFile()"><i class="fas fa-paperclip"></i></button>
                </div>
                <button class="send-btn" id="sendBtn" onclick="sendMessage()">
                    <i class="fas fa-paper-plane"></i>
                </button>
            </div>

            <!-- Emoji Picker -->
            <div class="emoji-picker" id="emojiPicker">
                <div class="emoji-grid" id="emojiGrid">
                    <!-- Rendered by JavaScript -->
                </div>
            </div>

        </main>
    </div>

    <!-- ============================================
    JAVASCRIPT - COMPLETE CHAT LOGIC
    ============================================ -->
    <script>
        // ============================================
        // CONFIGURATION
        // ============================================
        const API_BASE = window.location.origin + '/api';
        let currentUser = null;
        let authToken = null;
        let currentChatId = null;
        let currentContact = null;
        let messages = [];
        let contacts = [];
        let isTyping = false;
        let typingTimeout = null;
        let emojiList = ['😊', '😂', '❤️', '🔥', '👍', '👋', '😍', '🤣', '💯', '✨', '🎉', '🙌', '💪', '🤝', '👀', '😅', '🥰', '😘', '💕', '💖', '🌟', '⭐', '🏆', '🎯', '💡', '🧠', '💻', '📱', '🎮', '🎵', '📚', '💎'];

        // ============================================
        // AUTH CHECK
        // ============================================
        function checkAuth() {
            const token = localStorage.getItem('authToken');
            const user = localStorage.getItem('currentUser');
            if (!token || !user) {
                window.location.href = '/';
                return false;
            }
            authToken = token;
            currentUser = JSON.parse(user);
            return true;
        }

        // ============================================
        // INIT
        // ============================================
        async function init() {
            if (!checkAuth()) return;

            document.getElementById('loading-screen').classList.remove('hidden');

            try {
                // Load contacts
                await loadContacts();
                // Load emojis
                loadEmojis();
                // Update theme icon
                updateThemeIcon();

                setTimeout(() => {
                    document.getElementById('loading-screen').classList.add('hidden');
                }, 500);

                console.log('✅ Chat loaded successfully');
                console.log('👤 User:', currentUser?.displayName || 'User');

                // Auto-refresh contacts every 30 seconds
                setInterval(loadContacts, 30000);

            } catch (error) {
                console.error('❌ Init error:', error);
                document.getElementById('loading-screen').classList.add('hidden');
            }
        }

        // ============================================
        // LOAD CONTACTS
        // ============================================
        async function loadContacts() {
            try {
                const response = await fetch(API_BASE + '/friends', {
                    headers: { 'Authorization': `Bearer ${authToken}` }
                });

                if (!response.ok) {
                    if (response.status === 401) {
                        logout();
                        return;
                    }
                    throw new Error('Failed to load contacts');
                }

                const data = await response.json();
                contacts = data || [];
                renderContacts();

                // If we have a current chat, update it
                if (currentChatId) {
                    const contact = contacts.find(c => c.uid === currentChatId);
                    if (contact) {
                        currentContact = contact;
                        updateChatHeader();
                        await loadMessages(currentChatId);
                    }
                }

            } catch (error) {
                console.error('Error loading contacts:', error);
            }
        }

        // ============================================
        // RENDER CONTACTS
        // ============================================
        function renderContacts() {
            const container = document.getElementById('contactsList');
            const searchQuery = document.getElementById('searchContacts').value.toLowerCase();

            let filtered = contacts;
            if (searchQuery) {
                filtered = contacts.filter(c => 
                    c.displayName?.toLowerCase().includes(searchQuery) ||
                    c.username?.toLowerCase().includes(searchQuery)
                );
            }

            if (!filtered || filtered.length === 0) {
                container.innerHTML = `
                    <div class="empty-contacts">
                        <i class="fas fa-comment-slash"></i>
                        <h4>${contacts.length === 0 ? 'No Contacts' : 'No matches'}</h4>
                        <p>${contacts.length === 0 ? 'Start a chat by finding someone new!' : 'Try a different search'}</p>
                    </div>
                `;
                return;
            }

            container.innerHTML = filtered.map(contact => {
                const isActive = contact.uid === currentChatId;
                const status = contact.isOnline ? 'online' : 'offline';
                const statusLabel = contact.isOnline ? 'Online' : 'Offline';
                const initial = (contact.displayName || 'U').charAt(0).toUpperCase();

                return `
                    <div class="contact-item ${isActive ? 'active' : ''}" onclick="openChat('${contact.uid}')">
                        <div class="avatar">
                            ${initial}
                            <span class="status-dot ${status}"></span>
                        </div>
                        <div class="info">
                            <div class="name">
                                ${contact.displayName || contact.username || 'User'}
                                ${contact.isOnline ? '<span class="badge-online">●</span>' : ''}
                            </div>
                            <div class="last-msg">${contact.status || 'Available'}</div>
                        </div>
                        <div class="time">${formatTime(contact.lastSeen)}</div>
                    </div>
                `;
            }).join('');
        }

        // ============================================
        // OPEN CHAT
        // ============================================
        async function openChat(userId) {
            if (userId === currentChatId) return;

            currentChatId = userId;
            const contact = contacts.find(c => c.uid === userId);
            if (contact) {
                currentContact = contact;
                updateChatHeader();
                await loadMessages(userId);
                renderContacts();
                // Close sidebar on mobile
                if (window.innerWidth <= 768) {
                    document.getElementById('chatSidebar').classList.add('hidden');
                }
            }
        }

        // ============================================
        // UPDATE CHAT HEADER
        // ============================================
        function updateChatHeader() {
            if (!currentContact) {
                document.getElementById('chatName').textContent = 'Select a chat';
                document.getElementById('chatStatus').textContent = 'No conversation';
                document.getElementById('chatAvatar').textContent = '?';
                return;
            }

            const initial = (currentContact.displayName || 'U').charAt(0).toUpperCase();
            document.getElementById('chatName').textContent = currentContact.displayName || currentContact.username || 'User';
            document.getElementById('chatStatus').textContent = currentContact.isOnline ? '🟢 Online' : '⚫ Offline';
            document.getElementById('chatStatus').className = 'status ' + (currentContact.isOnline ? 'online' : '');
            document.getElementById('chatAvatar').textContent = initial;
        }

        // ============================================
        // LOAD MESSAGES
        // ============================================
        async function loadMessages(userId) {
            try {
                const response = await fetch(API_BASE + `/chats/${userId}/messages?limit=50`, {
                    headers: { 'Authorization': `Bearer ${authToken}` }
                });

                if (!response.ok) {
                    if (response.status === 404) {
                        // No chat yet, show empty
                        messages = [];
                        renderMessages();
                        return;
                    }
                    throw new Error('Failed to load messages');
                }

                const data = await response.json();
                messages = data || [];
                renderMessages();
                scrollToBottom();

                // Mark messages as read
                await markAsRead(userId);

            } catch (error) {
                console.error('Error loading messages:', error);
                messages = [];
                renderMessages();
            }
        }

        // ============================================
        // RENDER MESSAGES
        // ============================================
        function renderMessages() {
            const container = document.getElementById('messagesContainer');

            if (!messages || messages.length === 0) {
                container.innerHTML = `
                    <div class="empty-contacts" style="align-self:center;padding:40px 20px;">
                        <i class="fas fa-comment-dots" style="font-size:48px;color:var(--text-muted);opacity:0.3;"></i>
                        <h4>No messages yet</h4>
                        <p>Say hello to start the conversation!</p>
                    </div>
                `;
                return;
            }

            let html = '';
            let lastDate = '';

            messages.forEach(msg => {
                const msgDate = new Date(msg.createdAt).toLocaleDateString();
                if (msgDate !== lastDate) {
                    html += `<div class="date-divider">${msgDate}</div>`;
                    lastDate = msgDate;
                }

                const isMine = msg.senderId === currentUser?.uid;
                const time = new Date(msg.createdAt).toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' });

                // Check if message has reactions
                let reactionsHtml = '';
                if (msg.reactions && msg.reactions.length > 0) {
                    reactionsHtml = `<div class="reactions">${msg.reactions.map(r => `<span class="reaction">${r}</span>`).join('')}</div>`;
                }

                html += `
                    <div class="message ${isMine ? 'sent' : 'received'}">
                        ${msg.replyTo ? `<div class="reply-to">↩️ ${msg.replyTo}</div>` : ''}
                        <div class="text">${msg.text || '📎 Attachment'}</div>
                        ${reactionsHtml}
                        <span class="time">
                            ${time}
                            ${isMine ? `<span class="status-icon ${msg.readBy?.includes(currentUser?.uid) ? 'seen' : 'delivered'}">
                                ${msg.readBy?.includes(currentUser?.uid) ? '✓✓' : '✓'}
                            </span>` : ''}
                        </span>
                        <button class="menu-dots" onclick="showMessageOptions('${msg.id}')"><i class="fas fa-ellipsis-v"></i></button>
                    </div>
                `;
            });

            container.innerHTML = html;
            scrollToBottom();
        }

        // ============================================
        // SEND MESSAGE
        // ============================================
        async function sendMessage() {
            const input = document.getElementById('messageInput');
            const text = input.value.trim();

            if (!text || !currentChatId) {
                if (!currentChatId) showToast('Select a contact first');
                return;
            }

            // Disable send button
            const sendBtn = document.getElementById('sendBtn');
            sendBtn.disabled = true;

            try {
                const response = await fetch(API_BASE + `/chats/${currentChatId}/messages`, {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json',
                        'Authorization': `Bearer ${authToken}`
                    },
                    body: JSON.stringify({ text, type: 'text' })
                });

                if (!response.ok) {
                    throw new Error('Failed to send message');
                }

                const data = await response.json();
                input.value = '';
                messages.push(data);
                renderMessages();

                // Re-enable send button
                sendBtn.disabled = false;

                // Send typing stopped
                sendTyping(false);

            } catch (error) {
                console.error('Error sending message:', error);
                showToast('Failed to send message. Try again.');
                sendBtn.disabled = false;
            }
        }

        // ============================================
        // TYPING INDICATOR
        // ============================================
        function handleTyping() {
            if (!currentChatId) return;

            if (!isTyping) {
                isTyping = true;
                sendTyping(true);
            }

            clearTimeout(typingTimeout);
            typingTimeout = setTimeout(() => {
                isTyping = false;
                sendTyping(false);
            }, 2000);
        }

        function sendTyping(isTyping) {
            const indicator = document.getElementById('typingIndicator');
            if (isTyping) {
                indicator.classList.add('visible');
                document.getElementById('chatStatus').textContent = 'Typing...';
                document.getElementById('chatStatus').className = 'status typing';
            } else {
                indicator.classList.remove('visible');
                document.getElementById('chatStatus').textContent = currentContact?.isOnline ? '🟢 Online' : '⚫ Offline';
                document.getElementById('chatStatus').className = 'status ' + (currentContact?.isOnline ? 'online' : '');
            }
        }

        // ============================================
        // MARK AS READ
        // ============================================
        async function markAsRead(chatId) {
            try {
                await fetch(API_BASE + `/chats/${chatId}/read`, {
                    method: 'PUT',
                    headers: { 'Authorization': `Bearer ${authToken}` }
                });
            } catch (error) {
                console.error('Error marking as read:', error);
            }
        }

        // ============================================
        // EMOJI PICKER
        // ============================================
        function loadEmojis() {
            const grid = document.getElementById('emojiGrid');
            grid.innerHTML = emojiList.map(emoji => 
                `<button onclick="insertEmoji('${emoji}')">${emoji}</button>`
            ).join('');
        }

        function toggleEmojiPicker() {
            const picker = document.getElementById('emojiPicker');
            picker.classList.toggle('visible');
        }

        function insertEmoji(emoji) {
            const input = document.getElementById('messageInput');
            input.value += emoji;
            input.focus();
            document.getElementById('emojiPicker').classList.remove('visible');
            handleTyping();
        }

        // ============================================
        // KEYBOARD SHORTCUTS
        // ============================================
        function handleKeyDown(e) {
            if (e.key === 'Enter' && !e.shiftKey) {
                e.preventDefault();
                sendMessage();
            }
            if (e.key === 'Escape') {
                document.getElementById('emojiPicker').classList.remove('visible');
            }
            handleTyping();
        }

        // ============================================
        // HELPER FUNCTIONS
        // ============================================
        function scrollToBottom() {
            const container = document.getElementById('messagesContainer');
            setTimeout(() => {
                container.scrollTop = container.scrollHeight;
            }, 50);
        }

        function formatTime(timestamp) {
            if (!timestamp) return '';
            const date = new Date(timestamp);
            const now = new Date();
            if (date.toDateString() === now.toDateString()) {
                return date.toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' });
            }
            return date.toLocaleDateString();
        }

        function showToast(message) {
            const existing = document.querySelector('.custom-toast');
            if (existing) existing.remove();

            const toast = document.createElement('div');
            toast.className = 'custom-toast';
            toast.style.cssText = `
                position: fixed; bottom: 24px; left: 50%; transform: translateX(-50%);
                background: var(--bg-secondary); border: 1px solid var(--border-glass);
                border-radius: var(--radius-sm); padding: 12px 24px;
                color: var(--text-primary); font-size: 14px;
                box-shadow: var(--shadow); z-index: 9999;
                animation: slideUp 0.3s ease;
                max-width: 340px; text-align: center;
            `;
            toast.textContent = message;
            document.body.appendChild(toast);
            setTimeout(() => {
                toast.style.opacity = '0';
                setTimeout(() => toast.remove(), 300);
            }, 2500);
        }

        // ============================================
        // NAVIGATION
        // ============================================
        function goHome() {
            window.location.href = '/home.html';
        }

        function toggleSidebar() {
            document.getElementById('chatSidebar').classList.toggle('hidden');
        }

        function toggleTheme() {
            const html = document.documentElement;
            const current = html.getAttribute('data-theme');
            const next = current === 'light' ? 'dark' : 'light';
            html.setAttribute('data-theme', next);
            localStorage.setItem('preferredTheme', next);
            updateThemeIcon();
        }

        function updateThemeIcon() {
            const theme = document.documentElement.getAttribute('data-theme');
            document.getElementById('themeIcon').className = theme === 'light' ? 'fas fa-sun' : 'fas fa-moon';
        }

        function logout() {
            if (authToken) {
                fetch(API_BASE + '/auth/logout', { method: 'POST', headers: { 'Authorization': `Bearer ${authToken}` } }).catch(() => {});
            }
            localStorage.removeItem('authToken');
            localStorage.removeItem('currentUser');
            window.location.href = '/';
        }

        // ============================================
        // PLACEHOLDER FUNCTIONS
        // ============================================
        function startCall() {
            showToast('📞 Voice call feature coming soon!');
        }

        function startVideo() {
            showToast('📹 Video call feature coming soon!');
        }

        function showMoreOptions() {
            showToast('⚙️ More options coming soon!');
        }

        function showMessageOptions(msgId) {
            showToast('📌 Message options coming soon!');
        }

        function attachFile() {
            showToast('📎 File attachment coming soon!');
        }

        // ============================================
        // SEARCH CONTACTS
        // ============================================
        document.getElementById('searchContacts').addEventListener('input', renderContacts);

        // ============================================
        // INIT
        // ============================================
        document.addEventListener('DOMContentLoaded', init);

        console.log('🚀 Solo Chat - Chat Interface');
        console.log('💬 Real-time chat ready');
        console.log('📱 Select a contact to start chatting');
    </script>
</body>
  </html>
